databases:
  - name: chatwave-db
    plan: free
    region: oregon
    databaseName: chatwave
    user: chatwave

services:
  - type: web
    name: chatwave-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: chatwave-backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: chatwave-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
  - type: cron
    name: chatwave-retention
    runtime: node
    plan: free
    region: oregon
    rootDir: chatwave-backend
    schedule: "0 * * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run purge
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: chatwave-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
